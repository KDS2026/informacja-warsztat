<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440"><style>text{font-family:Arial,sans-serif;fill:#221b1b;font-size:18px}.label{font-size:17px;font-weight:bold;fill:#245c99}.small{font-size:15px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245c99" stroke-width="1.5"/></marker></defs><text x="12" y="28" class="label">CO KSZTAŁTUJE TWÓJ EKRAN?</text><g stroke="#c8d7eb" fill="white" stroke-width="2"><rect x="12" y="51" width="375" height="100" rx="7"/><rect x="12" y="167" width="375" height="100" rx="7"/><rect x="12" y="283" width="375" height="100" rx="7"/></g><g fill="#245c99"><circle cx="47" cy="92" r="21"/><circle cx="47" cy="208" r="21"/><circle cx="47" cy="324" r="21"/></g><g style="fill:white;font-weight:bold"><text x="41" y="99">1</text><text x="41" y="215">2</text><text x="41" y="331">3</text></g><text x="84" y="82" class="label">RELACJE</text><text x="84" y="109">Kogo obserwuję?</text><text x="84" y="135" class="small">Np. osoby ze swojej klasy.</text><text x="84" y="198" class="label">WŁASNY WYBÓR</text><text x="84" y="225">Co otwieram, co pomijam?</text><text x="84" y="251" class="small">Np. wybieram film o kosmosie.</text><text x="84" y="314" class="label">PERSONALIZACJA</text><text x="84" y="341">Co poleca mi system?</text><text x="84" y="367" class="small">Np. kolejne podobne treści.</text><path d="M200 389V410" stroke="#245c99" stroke-width="2" marker-end="url(#a)"/><text x="60" y="435" class="label">TRZY RÓŻNE PROCESY</text></svg>